<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="coin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Decorative dots -->
  <circle cx="80"  cy="80"  r="12" fill="white" opacity="0.15"/>
  <circle cx="432" cy="80"  r="8"  fill="white" opacity="0.12"/>
  <circle cx="60"  cy="420" r="8"  fill="white" opacity="0.10"/>
  <circle cx="440" cy="430" r="14" fill="white" opacity="0.12"/>
  <circle cx="150" cy="440" r="6"  fill="#0ea5e9" opacity="0.6"/>
  <circle cx="370" cy="60"  r="6"  fill="#0ea5e9" opacity="0.6"/>

  <!-- Gold coin -->
  <circle cx="256" cy="235" r="148" fill="url(#coin)"/>
  <circle cx="256" cy="235" r="128" fill="#fde68a" opacity="0.25"/>

  <!-- Shine on coin -->
  <ellipse cx="205" cy="180" rx="38" ry="22" fill="white" opacity="0.22" transform="rotate(-35 205 180)"/>

  <!-- ₪ symbol -->
  <text x="256" y="315"
        text-anchor="middle"
        font-size="195"
        font-weight="bold"
        font-family="Arial Hebrew, Arial, sans-serif"
        fill="#78350f">₪</text>

  <!-- Growth arrows bottom (Yuval's icon carries stars here) -->
  <polygon points="110,462 110,424 92,424 122,388 152,424 134,424 134,462"
           fill="#38bdf8" opacity="0.9"/>
  <polygon points="392,458 392,428 378,428 402,398 426,428 412,428 412,458"
           fill="#38bdf8" opacity="0.7"/>
</svg>
